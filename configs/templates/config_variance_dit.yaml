base_config:
- configs/variance.yaml
dictionaries:
  zh: dictionaries/opencpop-extension.txt
all_phonemes:
- AP
- SP
extra_phonemes: []
merged_phoneme_groups: []
datasets:
- raw_data_dir: data/xxx/raw
  speaker: speaker
  spk_id: 0
  language: zh
  test_prefixes:
  - wav1
binary_data_dir: data/xxx/binary
binarization_args:
  num_workers: 0
  allow_missing_phonemes: false
use_lang_id: false
num_lang: 1
use_spk_id: false
num_spk: 1
predict_dur: true
predict_pitch: true
predict_energy: true
predict_breathiness: true
predict_voicing: true
predict_tension: true
dit_contract:
  version: 1
  valid_mask_source: mel2ph
  valid_mask_true_is_valid: true
  padded_batches_require_mask: true
pitch_prediction_args:
  backbone_type: dit
  backbone_args:
    num_layers: 4
    num_channels: 256
    num_heads: 4
    mlp_ratio: 4
    time_embed_dim: 256
    patch_size: 1
    rope_base: 10000.0
    layer_norm_eps: 1.0e-06
    attention_dropout: 0.0
    mlp_dropout: 0.0
    use_gradient_checkpointing: true
variances_prediction_args:
  backbone_type: dit
  backbone_args:
    num_layers: 4
    num_channels: 256
    num_heads: 4
    mlp_ratio: 4
    time_embed_dim: 256
    patch_size: 1
    rope_base: 10000.0
    layer_norm_eps: 1.0e-06
    attention_dropout: 0.0
    mlp_dropout: 0.0
    use_gradient_checkpointing: true
diffusion_type: reflow
sampling_algorithm: euler
sampling_steps: 20
time_scale_factor: 1000
max_batch_frames: 768
max_batch_size: 1
max_val_batch_frames: 768
max_val_batch_size: 1
max_sample_frames: 768
accumulate_grad_batches: 8
clip_grad_norm: 1.0
use_dual_timestep: false
use_fused_kernels: false
ds_workers: 0
vocoder_ckpt: ckpt/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02/model.ckpt
