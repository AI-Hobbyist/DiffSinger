base_config:
- configs/all_in_one.yaml
task_cls: training.all_in_one_task.AllInOneTask
binarizer_cls: preprocessing.all_in_one_binarizer.AllInOneBinarizer
all_in_one:
  enabled: true
val_with_variance:
  enable: false
dictionaries:
  zh: dictionaries/opencpop-extension.txt
all_phonemes:
- AP
- SP
extra_phonemes: []
merged_phoneme_groups: []
datasets:
- raw_data_dir: data/opencpop
  speaker: opencpop
  spk_id: 0
  language: zh
  test_prefixes:
  - prefix_1
  - prefix_2
binary_data_dir: data/opencpop/binary-all-in-one
binarization_args:
  shuffle: true
  num_workers: 0
  prefer_ds: false
  allow_missing_phonemes: false
use_lang_id: false
num_lang: 1
use_spk_id: false
num_spk: 1
use_energy_embed: true
use_breathiness_embed: true
use_voicing_embed: true
use_tension_embed: true
use_key_shift_embed: true
use_speed_embed: true
predict_dur: true
predict_pitch: true
predict_energy: true
predict_breathiness: true
predict_voicing: true
predict_tension: true
dit_contract:
  version: 1
  valid_mask_source: mel2ph
  valid_mask_true_is_valid: true
  padded_batches_require_mask: true
backbone_type: dit
backbone_args:
  num_layers: 8
  num_channels: 384
  num_heads: 6
  mlp_ratio: 4
  time_embed_dim: 256
  patch_size: 1
  rope_base: 10000.0
  layer_norm_eps: 1.0e-06
  attention_dropout: 0.0
  mlp_dropout: 0.0
  use_gradient_checkpointing: true
pitch_prediction_args:
  backbone_type: dit
  backbone_args:
    num_layers: 4
    num_channels: 256
    num_heads: 4
    mlp_ratio: 4
    time_embed_dim: 256
    patch_size: 1
    rope_base: 10000.0
    layer_norm_eps: 1.0e-06
    attention_dropout: 0.0
    mlp_dropout: 0.0
    use_gradient_checkpointing: true
variances_prediction_args:
  backbone_type: dit
  backbone_args:
    num_layers: 4
    num_channels: 256
    num_heads: 4
    mlp_ratio: 4
    time_embed_dim: 256
    patch_size: 1
    rope_base: 10000.0
    layer_norm_eps: 1.0e-06
    attention_dropout: 0.0
    mlp_dropout: 0.0
    use_gradient_checkpointing: true
diffusion_type: reflow
sampling_algorithm: euler
sampling_steps: 20
time_scale_factor: 1000
use_shallow_diffusion: true
T_start: 0.4
T_start_infer: 0.4
val_with_vocoder: false
max_batch_frames: 1536
max_batch_size: 2
max_val_batch_frames: 768
max_val_batch_size: 1
max_sample_frames: 768
accumulate_grad_batches: 8
clip_grad_norm: 1.0
optimizer_args:
  optimizer_cls: torch.optim.AdamW
  lr: 0.0003
  weight_decay: 0.0
lr_scheduler_args:
  scheduler_cls: torch.optim.lr_scheduler.SequentialLR
  schedulers:
  - cls: torch.optim.lr_scheduler.LinearLR
    start_factor: 0.01
    end_factor: 1.0
    total_iters: 1000
  - cls: torch.optim.lr_scheduler.StepLR
    step_size: 5000
    gamma: 0.8
  milestones:
  - 1000
use_dual_timestep: false
use_fused_kernels: false
ds_workers: 0
vocoder_ckpt: checkpoints/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02/model.ckpt
